name: Build tsnet-bridge AAR

on:
  push:
    branches: [main]
    paths:
      - 'admin/tsnet-bridge/**'
      - '.github/workflows/build-tsnet-bridge.yml'
  pull_request:
    paths:
      - 'admin/tsnet-bridge/**'
  workflow_dispatch:

jobs:
  build:
    name: gomobile bind → tsnetbridge.aar
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1'

      - name: Export NDK env
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Setup Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Show Go version
        run: go version

      - name: Install gomobile + gobind
        run: |
          go install golang.org/x/mobile/cmd/gomobile@master
          go install golang.org/x/mobile/cmd/gobind@master
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: gomobile init
        run: gomobile init

      - name: Debug - Show Go environment
        run: go env

      - name: Fetch Go dependencies with full diagnostics
        working-directory: admin/tsnet-bridge
        env:
          GONOSUMDB: '*'
          GONOSUMCHECK: '*'
          GOSUMDB: 'off'
          GOPROXY: 'direct'
        run: |
          set -x
          echo "=== go get tailscale ==="
          go get tailscale.com@v1.76.0 2>&1 || true
          echo "=== go get x/mobile ==="
          go get golang.org/x/mobile@master 2>&1 || true
          echo "=== go mod tidy (verbose) ==="
          go mod tidy -v 2>&1 || true
          echo "=== go mod download -x ==="
          go mod download -x 2>&1 || true
          echo "=== go mod verify ==="
          go mod verify 2>&1 || true
          echo "=== go mod graph (first 50 lines) ==="
          go mod graph 2>&1 | head -50 || true
          echo "=== Final go.mod ==="
          cat go.mod

      - name: Build AAR (arm64-v8a) with verbose output
        working-directory: admin/tsnet-bridge
        env:
          GONOSUMDB: '*'
          GONOSUMCHECK: '*'
          GOSUMDB: 'off'
          GOPROXY: 'direct'
        run: |
          set -x
          gomobile bind \
            -target=android/arm64 \
            -androidapi 24 \
            -v \
            -o tsnetbridge.aar \
            . 2>&1 || true
          echo "=== AAR file info ==="
          ls -lh tsnetbridge.aar || true
          file tsnetbridge.aar || true

      - name: Upload AAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsnetbridge-aar
          path: admin/tsnet-bridge/tsnetbridge.aar
          retention-days: 30
          if-no-files-found: ignore
