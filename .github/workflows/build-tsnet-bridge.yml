name: Build tsnet-bridge AAR

on:
  push:
    branches: [main]
    paths:
      - 'admin/tsnet-bridge/**'
      - '.github/workflows/build-tsnet-bridge.yml'
  pull_request:
    paths:
      - 'admin/tsnet-bridge/**'
  workflow_dispatch:

jobs:
  build:
    name: gomobile bind → tsnetbridge.aar
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1'

      - name: Export NDK env
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install gomobile + gobind (from @master)
        run: |
          go install golang.org/x/mobile/cmd/gomobile@master
          go install golang.org/x/mobile/cmd/gobind@master
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: gomobile init
        run: gomobile init

      - name: Fetch Go deps (@master for x/mobile)
        working-directory: admin/tsnet-bridge
        run: |
          go get tailscale.com@v1.76.0
          go get golang.org/x/mobile@master
          go mod tidy
          echo "=== go.mod after tidy ==="
          cat go.mod

      - name: Verify x/mobile still in go.mod
        working-directory: admin/tsnet-bridge
        run: |
          if ! grep -q "golang.org/x/mobile" go.mod; then
            echo "::error::golang.org/x/mobile vanished from go.mod after go mod tidy"
            echo "=== go.mod ==="
            cat go.mod
            exit 1
          fi
          echo "✓ golang.org/x/mobile present in go.mod"

      - name: Build AAR (arm64-v8a only)
        working-directory: admin/tsnet-bridge
        run: |
          gomobile bind \
            -target=android/arm64 \
            -androidapi 24 \
            -v \
            -o tsnetbridge.aar \
            .
          ls -lh tsnetbridge.aar

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: tsnetbridge-aar
          path: admin/tsnet-bridge/tsnetbridge.aar
          retention-days: 30
          if-no-files-found: error
