name: Build tsnet-bridge AAR

on:
  push:
    branches: [main]
    paths:
      - 'admin/tsnet-bridge/**'
      - '.github/workflows/build-tsnet-bridge.yml'
  workflow_dispatch:

jobs:
  build:
    name: gomobile bind → tsnetbridge.aar
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1'

      - name: Export NDK env
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Setup Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install gomobile + gobind
        run: |
          go install golang.org/x/mobile/cmd/gomobile@master
          go install golang.org/x/mobile/cmd/gobind@master
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: gomobile init
        run: gomobile init

      - name: Fetch Go deps (ensure x/mobile stays)
        working-directory: admin/tsnet-bridge
        env:
          GOSUMDB: 'off'
          GOPROXY: 'direct'
        run: |
          go get tailscale.com@v1.76.0
          go get golang.org/x/mobile@latest
          go mod tidy
          # إعادة إضافة x/mobile بعد tidy لضمان بقائه
          go get golang.org/x/mobile@latest
          echo "=== go.mod ==="
          cat go.mod

      - name: Build AAR
        working-directory: admin/tsnet-bridge
        env:
          GOSUMDB: 'off'
          GOPROXY: 'direct'
        run: |
          gomobile bind \
            -target=android/arm64 \
            -androidapi 24 \
            -o tsnetbridge.aar \
            .
          ls -lh tsnetbridge.aar

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: tsnetbridge-aar
          path: admin/tsnet-bridge/tsnetbridge.aar
          if-no-files-found: error
