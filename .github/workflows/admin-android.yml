name: Build Admin APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aar:
    name: Build tsnet-bridge AAR
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1'
      - run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with: { go-version: '1.23.1' }
      - run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20241004191011-08a83c5af9f8
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20241004191011-08a83c5af9f8
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: gomobile init
      - working-directory: admin/tsnet-bridge
        run: |
          set -e
          go get tailscale.com@v1.88.4
          go get golang.org/x/mobile@v0.0.0-20241004191011-08a83c5af9f8
          go mod tidy
          cat go.mod
          grep "golang.org/x/mobile" go.mod
      - working-directory: admin/tsnet-bridge
        run: |
          set -e
          gomobile bind -target=android/arm64 -androidapi 24 -o tsnetbridge.aar .
          ls -lh tsnetbridge.aar
      - uses: actions/upload-artifact@v4
        with:
          name: tsnetbridge-aar
          path: admin/tsnet-bridge/tsnetbridge.aar
          retention-days: 30
          if-no-files-found: error

  build-admin:
    name: Build Admin debug APK
    needs: build-aar
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - uses: actions/download-artifact@v4
        with:
          name: tsnetbridge-aar
          path: admin/android/app/libs
      - run: |
          set -e
          test -s admin/android/app/libs/tsnetbridge.aar
          ls -lh admin/android/app/libs/tsnetbridge.aar
      - working-directory: admin/android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - run: |
          APK_DIR="admin/android/app/build/outputs/apk/debug"
          test -d "$APK_DIR"
          find "$APK_DIR" -name '*.apk' -print
          test "$(find "$APK_DIR" -name '*.apk' | wc -l)" -ge 1
      - uses: actions/upload-artifact@v4
        with:
          name: admin-debug-apk
          path: admin/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error
