name: Build Admin APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-admin:
    name: Build Admin debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Guard Android project
        id: guard
        run: |
          set -e

          if [ ! -f admin/android/settings.gradle.kts ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No admin/android/settings.gradle.kts yet — skipping APK build."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Android project
        if: steps.guard.outputs.skip == 'false'
        working-directory: admin/android
        run: |
          set -e
          gradle :app:tasks --no-daemon

      - name: Build debug APK
        if: steps.guard.outputs.skip == 'false'
        working-directory: admin/android
        run: |
          set -e
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        if: steps.guard.outputs.skip == 'false'
        run: |
          set -e

          APK_DIR="admin/android/app/build/outputs/apk/debug"

          test -d "$APK_DIR"
          find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print

          APK_COUNT="$(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' | wc -l)"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: no APK generated"
            exit 1
          fi

      - name: Upload APK
        if: steps.guard.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: admin-debug-apk
          path: admin/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error
